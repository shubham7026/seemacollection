<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Boot Login</title>
    <style>
        /* This is the CSS to make the login page look nice */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        .login-box h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Ensures padding doesn't widen the box */
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Login</h2>

    <!-- The form where users type their details -->
    <form id="loginForm">
        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">Submit</button>
    </form>

    <!-- A place to show error or success messages -->
    <div id="message"></div>
</div>

<script>
    // This is the JavaScript that connects the frontend to your Spring Boot Backend

    document.getElementById('loginForm').addEventListener('submit', function(event) {
        // 1. Prevent the page from reloading when the button is clicked
        event.preventDefault();

        // 2. Grab the values the user typed in
        const usernameInput = document.getElementById('username').value;
        const passwordInput = document.getElementById('password').value;

        // 3. Create the JSON object expected by your Spring Boot API
        const requestBody = {
            username: usernameInput,
            password: passwordInput
        };

        // 4. Send the POST request to your Spring Boot API
        fetch('http://localhost:8080/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(requestBody)
        })
        .then(response => {
            const messageDiv = document.getElementById('message');

            // If the backend returns a 200 OK status
            if (response.ok) {
                messageDiv.style.color = "green";
                messageDiv.innerText = "Login Successful!";
                // Optional: Redirect the user to a dashboard page
                // window.location.href = "dashboard.html";
            } else {
                // If the backend returns an error (like 401 Unauthorized)
                messageDiv.style.color = "red";
                messageDiv.innerText = "Invalid username or password!";
            }
        })
        .catch(error => {
            // If the frontend cannot reach the backend at all
            console.error("Error:", error);
            document.getElementById('message').style.color = "red";
            document.getElementById('message').innerText = "Could not connect to the server.";
        });
    });
</script>
</body>
</html>
