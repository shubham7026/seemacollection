spring:
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:3306/seemacollection
  application:
    name: seemacollection

server:
  servlet:
    context-path: /api/v1
  port: 8091

credit:
  enabled: "true"
  points: 100
